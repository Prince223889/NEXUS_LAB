plugins { id 'com.android.application' }

// Copie de l'interface du MASTER dans l'APK : mode téléphone, utilisable sans le box.
def nexusWww = layout.buildDirectory.dir('generated/nexusWww')
def wwwSrc = rootProject.file('../firmware/master/www')
tasks.register('copyNexusWww', Copy) {
    from(wwwSrc) { include 'index.html', 'app.js', 'app.css', 'catalog.js' }
    into nexusWww.map { it.dir('www') }
    doFirst { if (!new File(wwwSrc, 'app.js').exists()) throw new GradleException("Interface absente : ${wwwSrc}/app.js (python3 scripts/repair.py)") }
}

// Signature : clé fournie par l'environnement (GitHub Actions ou PC), sinon clé de débogage.
//   NEXUS_KEYSTORE (fichier .jks), NEXUS_KEYSTORE_PASS, NEXUS_KEY_ALIAS, NEXUS_KEY_PASS
def ks = System.getenv('NEXUS_KEYSTORE')
def hasKey = ks && new File(ks).exists()

android {
    namespace 'local.nexus.lab'
    compileSdk 35
    defaultConfig {
        applicationId 'local.nexus.lab'
        minSdk 24
        // 28 : le Pi signe les applications du Studio APK en schéma v1 (Python, sans SDK) ; Android 11+ exige v2
        // pour une cible 30 ou plus. Voir docs/ANDROID_SECURITE.md.
        targetSdk 28
        versionCode 4
        versionName '1.3.0'
    }
    signingConfigs {
        if (hasKey) {
            nexus {
                storeFile file(ks)
                storePassword System.getenv('NEXUS_KEYSTORE_PASS')
                keyAlias System.getenv('NEXUS_KEY_ALIAS') ?: 'nexus'
                keyPassword System.getenv('NEXUS_KEY_PASS') ?: System.getenv('NEXUS_KEYSTORE_PASS')
            }
        }
    }
    buildTypes {
        debug { if (hasKey) signingConfig signingConfigs.nexus }
        release {
            minifyEnabled false
            signingConfig hasKey ? signingConfigs.nexus : signingConfigs.debug
        }
    }
    sourceSets { main { assets.srcDir(nexusWww) } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
tasks.named('preBuild') { dependsOn 'copyNexusWww' }
