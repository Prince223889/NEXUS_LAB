; ESP32 LAB — Worker (option PlatformIO ; Arduino IDE reste la méthode de référence)
; Même cœur que l'IDE : Arduino-ESP32 3.3.12 (ESP-IDF 5.5.5).

[platformio]
src_dir = .
default_envs = esp32-worker

[worker_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
platform_packages =
    pioarduino/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.12/esp32-core-3.3.12.tar.xz
    pioarduino/framework-espidf@https://github.com/pioarduino/esp-idf/releases/download/v5.5.5/esp-idf-v5.5.5.tar.xz
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_src_filter = +<worker.ino>
build_flags = -DCORE_DEBUG_LEVEL=0

[env:esp32-worker]
extends = worker_common
board = esp32dev

[env:esp32s3-worker]
extends = worker_common
board = esp32-s3-devkitc-1
