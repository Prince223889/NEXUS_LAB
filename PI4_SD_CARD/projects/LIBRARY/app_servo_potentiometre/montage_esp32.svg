<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 442" width="980" height="442" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect width="980" height="442" fill="#ffffff"/>
<text x="490" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111">app_servo_potentiometre — Servomoteur piloté par potentiomètre</text>
<text x="151" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#111">ESP32 DevKit V1 (WROOM-32)</text>
<rect x="36" y="96" width="230" height="190" rx="8" fill="#0d6ea8" stroke="#0a3d5c" stroke-width="2"/>
<text x="248" y="127" text-anchor="end" font-size="14" font-weight="700" fill="#fff">3V3</text>
<text x="248" y="159" text-anchor="end" font-size="14" font-weight="700" fill="#fff">5V</text>
<text x="248" y="191" text-anchor="end" font-size="14" font-weight="700" fill="#fff">GND</text>
<text x="248" y="223" text-anchor="end" font-size="14" font-weight="700" fill="#fff">GPIO4</text>
<text x="248" y="255" text-anchor="end" font-size="14" font-weight="700" fill="#fff">GPIO34</text>
<path d="M266 122 H306 V126 H600" fill="none" stroke="#e53935" stroke-width="3" stroke-linejoin="round"><title>3V3 → Potentiomètre 10 kΩ VCC</title></path>
<path d="M266 186 H326 V158 H600" fill="none" stroke="#212121" stroke-width="3" stroke-linejoin="round"><title>GND → Potentiomètre 10 kΩ GND</title></path>
<path d="M266 250 H346 V190 H600" fill="none" stroke="#43a047" stroke-width="3" stroke-linejoin="round"><title>GPIO34 → Potentiomètre 10 kΩ curseur (broche du milieu) — extrémités sur 3V3 et GND</title></path>
<path d="M266 154 H366 V270 H600" fill="none" stroke="#fb8c00" stroke-width="3" stroke-linejoin="round"><title>5V (VIN) → Servomoteur SG90 / MG90S VCC</title></path>
<path d="M266 186 H386 V302 H600" fill="none" stroke="#212121" stroke-width="3" stroke-linejoin="round"><title>GND → Servomoteur SG90 / MG90S GND</title></path>
<path d="M266 218 H406 V334 H600" fill="none" stroke="#1e88e5" stroke-width="3" stroke-linejoin="round"><title>GPIO4 → Servomoteur SG90 / MG90S signal (orange)</title></path>
<circle cx="266" cy="122" r="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<circle cx="266" cy="154" r="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<circle cx="266" cy="186" r="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<circle cx="266" cy="218" r="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<circle cx="266" cy="250" r="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="772" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Potentiomètre 10 kΩ (pot)</text>
<rect x="600" y="96" width="344" height="118" rx="6" fill="#f3f0e6" stroke="#111" stroke-width="1.5"/>
<rect x="594" y="120" width="12" height="12" fill="#e53935"/>
<text x="616" y="131" font-size="13" fill="#111">VCC</text>
<rect x="594" y="152" width="12" height="12" fill="#212121"/>
<text x="616" y="163" font-size="13" fill="#111">GND</text>
<rect x="594" y="184" width="12" height="12" fill="#43a047"/>
<text x="616" y="195" font-size="13" fill="#111">curseur (broche du milieu)</text>
<text x="934" y="195" text-anchor="end" font-size="10.5" fill="#666">extrémités sur 3V3 et GND</text>
<text x="772" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Servomoteur SG90 / MG90S (servo)</text>
<rect x="600" y="240" width="344" height="118" rx="6" fill="#f3f0e6" stroke="#111" stroke-width="1.5"/>
<rect x="594" y="264" width="12" height="12" fill="#fb8c00"/>
<text x="616" y="275" font-size="13" fill="#111">VCC</text>
<rect x="594" y="296" width="12" height="12" fill="#212121"/>
<text x="616" y="307" font-size="13" fill="#111">GND</text>
<rect x="594" y="328" width="12" height="12" fill="#1e88e5"/>
<text x="616" y="339" font-size="13" fill="#111">signal (orange)</text>
<text x="36" y="420" font-size="12" fill="#777">ESP32 LAB 6.1.0 — fils : rouge = 3V3, orange = 5V, noir = GND, couleurs = signaux. Toujours câbler carte débranchée.</text>
</svg>
