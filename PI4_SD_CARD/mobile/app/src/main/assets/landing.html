<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101621"><title>NEXUS LAB</title><style>:root{color-scheme:dark;font-family:system-ui;background:#101621;color:#edf2fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 80% 0,#1b3157 0,transparent 52%),#101621}main{width:min(100%,460px);border:1px solid #2b3a51;border-radius:26px;padding:26px;background:#171f2b;box-shadow:0 24px 70px #0007}.mark{width:48px;height:48px;border-radius:15px;background:#4d78ff;display:grid;place-items:center;font-weight:900;font-size:24px}.tag{color:#91a0b7;font-size:11px;letter-spacing:.16em;font-weight:800;margin-top:24px}h1{font-size:31px;line-height:1.1;margin:8px 0}p{color:#aebbd0;line-height:1.55}label{display:block;font-size:13px;color:#aebbd0;margin:20px 0 7px}input{width:100%;padding:14px;border:1px solid #35465e;border-radius:13px;background:#101621;color:#fff;font:inherit}button{width:100%;padding:14px;border:0;border-radius:13px;background:#4d78ff;color:white;font:700 15px system-ui;margin-top:12px}.hint{font-size:12px;color:#8494ad;margin-top:18px}.pills{display:flex;gap:8px;margin-top:20px}.pills span{border:1px solid #314057;padding:7px 10px;border-radius:99px;font-size:11px;color:#c8d5e8}</style><main><div class="mark">N</div><div class="tag">ESP32 LAB · NEXUS</div><h1>Ton atelier connecté.</h1><p>Connecte l’application au MASTER. Tu pourras modifier l’adresse plus tard.</p><form id="connect"><label for="url">Adresse du MASTER</label><input id="url" value="http://192.168.4.1" autocomplete="url" required><button>Ouvrir le laboratoire</button></form><div class="pills"><span>Projets</span><span>Studio</span><span>Workers</span></div><div class="hint">Connecte ton téléphone au Wi-Fi ESP32-LAB ou au même routeur que le MASTER.</div><script>const i=document.querySelector('#url');try{i.value=localStorage.getItem('nexus.master')||i.value}catch(e){}document.querySelector('#connect').addEventListener('submit',e=>{e.preventDefault();let v=i.value.trim();if(!/^https?:\/\//i.test(v))v='http://'+v;try{localStorage.setItem('nexus.master',v)}catch(e){}location.href='nexus://connect?url='+encodeURIComponent(v)});</script></main></html>
