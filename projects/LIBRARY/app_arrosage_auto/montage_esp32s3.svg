<path d="M266 154 H366 V270 H600" fill="none" stroke="#fb8c00" stroke-width="3" stroke-linejoin="round"><title>5V (VIN) → Mini-pompe à eau 5 V (via MOSFET) VCC</title></path>
<path d="M266 186 H386 V302 H600" fill="none" stroke="#212121" stroke-width="3" stroke-linejoin="round"><title>GND → Mini-pompe à eau 5 V (via MOSFET) GND</title></path>
<path d="M266 250 H406 V334 H600" fill="none" stroke="#43a047" stroke-width="3" stroke-linejoin="round"><title>GPIO4 → Mini-pompe à eau 5 V (via MOSFET) grille MOSFET / IN relais</title></path>
<path d="M266 122 H426 V414 H600" fill="none" stroke="#e53935" stroke-width="3" stroke-linejoin="round"><title>3V3 → Écran OLED 0,96&quot; SSD1306 128×64 (I2C) VCC</title></path>
