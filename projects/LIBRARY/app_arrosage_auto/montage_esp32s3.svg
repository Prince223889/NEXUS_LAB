<path d="M266 122 H306 V126 H600" fill="none" stroke="#e53935" stroke-width="3" stroke-linejoin="round"><title>3V3 → Humidité du sol capacitive v1.2 VCC</title></path>
<path d="M266 186 H326 V158 H600" fill="none" stroke="#212121" stroke-width="3" stroke-linejoin="round"><title>GND → Humidité du sol capacitive v1.2 GND</title></path>
