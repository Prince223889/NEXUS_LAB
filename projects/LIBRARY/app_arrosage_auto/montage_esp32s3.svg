<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 618" width="980" height="618" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect width="980" height="618" fill="#ffffff"/>
<text x="490" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111">app_arrosage_auto — Arrosage automatique de plante</text>
