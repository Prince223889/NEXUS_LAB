<text x="934" y="627" text-anchor="end" font-size="10.5" fill="#666">cathode (patte courte) vers GND</text>
<text x="36" y="708" font-size="12" fill="#777">ESP32 LAB 6.1.0 — fils : rouge = 3V3, orange = 5V, noir = GND, couleurs = signaux. Toujours câbler carte débranchée.</text>
