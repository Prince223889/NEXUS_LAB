<rect width="980" height="730" fill="#ffffff"/>
<text x="490" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111">app_alarme_intrusion — Alarme anti-intrusion</text>
<text x="151" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#111">ESP32 DevKit V1 (WROOM-32)</text>
