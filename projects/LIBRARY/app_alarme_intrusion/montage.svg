<path d="M266 154 H306 V126 H600" fill="none" stroke="#fb8c00" stroke-width="3" stroke-linejoin="round"><title>5V (VIN) → HC-SR501 (PIR infrarouge passif) VCC</title></path>
<path d="M266 186 H326 V158 H600" fill="none" stroke="#212121" stroke-width="3" stroke-linejoin="round"><title>GND → HC-SR501 (PIR infrarouge passif) GND</title></path>
<path d="M266 314 H346 V190 H600" fill="none" stroke="#546e7a" stroke-width="3" stroke-linejoin="round"><title>GPIO34 → HC-SR501 (PIR infrarouge passif) OUT</title></path>
<path d="M266 122 H366 V270 H600" fill="none" stroke="#e53935" stroke-width="3" stroke-linejoin="round"><title>3V3 → Contact reed (ILS) VCC</title></path>
<path d="M266 186 H386 V302 H600" fill="none" stroke="#212121" stroke-width="3" stroke-linejoin="round"><title>GND → Contact reed (ILS) GND</title></path>
<path d="M266 218 H406 V334 H600" fill="none" stroke="#1e88e5" stroke-width="3" stroke-linejoin="round"><title>GPIO4 → Contact reed (ILS) signal — l&apos;autre borne vers GND</title></path>
<path d="M266 122 H426 V414 H600" fill="none" stroke="#e53935" stroke-width="3" stroke-linejoin="round"><title>3V3 → Buzzer actif 5 V VCC</title></path>
<path d="M266 186 H446 V446 H600" fill="none" stroke="#212121" stroke-width="3" stroke-linejoin="round"><title>GND → Buzzer actif 5 V GND</title></path>
<path d="M266 250 H466 V478 H600" fill="none" stroke="#43a047" stroke-width="3" stroke-linejoin="round"><title>GPIO13 → Buzzer actif 5 V + (via transistor si &gt; 20 mA)</title></path>
<path d="M266 122 H486 V558 H600" fill="none" stroke="#e53935" stroke-width="3" stroke-linejoin="round"><title>3V3 → LED + résistance 220 Ω VCC</title></path>
<path d="M266 186 H506 V590 H600" fill="none" stroke="#212121" stroke-width="3" stroke-linejoin="round"><title>GND → LED + résistance 220 Ω GND</title></path>
<path d="M266 282 H526 V622 H600" fill="none" stroke="#8e24aa" stroke-width="3" stroke-linejoin="round"><title>GPIO14 → LED + résistance 220 Ω anode (+) via 220 Ω — cathode (patte courte) vers GND</title></path>
