<path d="M266 122 H506 V542 H600" fill="none" stroke="#e53935" stroke-width="3" stroke-linejoin="round"><title>3V3 → LED + résistance 220 Ω VCC</title></path>
<path d="M266 186 H526 V574 H600" fill="none" stroke="#212121" stroke-width="3" stroke-linejoin="round"><title>GND → LED + résistance 220 Ω GND</title></path>
