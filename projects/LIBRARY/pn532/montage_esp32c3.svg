<circle cx="266" cy="314" r="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="772" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Lecteur NFC PN532 (I2C) (nfc)</text>
<rect x="600" y="96" width="344" height="246" rx="6" fill="#f3f0e6" stroke="#111" stroke-width="1.5"/>
