<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 426" width="980" height="426" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect width="980" height="426" fill="#ffffff"/>
<text x="490" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111">pn532 — Lecteur NFC PN532 (I2C)</text>
<text x="151" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#111">ESP32-C3 SuperMini / DevKitM</text>
<rect x="36" y="96" width="230" height="254" rx="8" fill="#0d6ea8" stroke="#0a3d5c" stroke-width="2"/>
<text x="248" y="127" text-anchor="end" font-size="14" font-weight="700" fill="#fff">3V3</text>
<text x="248" y="159" text-anchor="end" font-size="14" font-weight="700" fill="#fff">GND</text>
<text x="248" y="191" text-anchor="end" font-size="14" font-weight="700" fill="#fff">GPIO3</text>
<text x="248" y="223" text-anchor="end" font-size="14" font-weight="700" fill="#fff">GPIO8</text>
<text x="248" y="255" text-anchor="end" font-size="14" font-weight="700" fill="#fff">GPIO9</text>
<text x="248" y="287" text-anchor="end" font-size="14" font-weight="700" fill="#fff">GPIO10</text>
<text x="248" y="319" text-anchor="end" font-size="14" font-weight="700" fill="#fff">I2C : SW1 = ON, SW2 = OFF</text>
<path d="M266 122 H306 V126 H600" fill="none" stroke="#e53935" stroke-width="3" stroke-linejoin="round"><title>3V3 → Lecteur NFC PN532 (I2C) VCC</title></path>
