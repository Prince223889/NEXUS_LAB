<path d="M266 186 H386 V254 H600" fill="none" stroke="#1e88e5" stroke-width="3" stroke-linejoin="round"><title>GPIO3 → Lecteur NFC PN532 (I2C) IRQ</title></path>
<path d="M266 282 H406 V286 H600" fill="none" stroke="#546e7a" stroke-width="3" stroke-linejoin="round"><title>GPIO10 → Lecteur NFC PN532 (I2C) RSTO</title></path>
<path d="M266 314 H426 V318 H600" fill="none" stroke="#00897b" stroke-width="3" stroke-linejoin="round"><title>I2C : SW1 = ON, SW2 = OFF → Lecteur NFC PN532 (I2C) interrupteurs — mode I2C du module rouge</title></path>
